backend:
  name: git-gateway
  branch: main

local_backend: true
locale: "pt"
site_url: "/"
logo_url: "/admin/logo.png"

media_folder: "public/uploads"
public_folder: "/uploads"

load_config_file: true
publish_mode: simple

slug:
  clean_accents: true

editor:
  preview: true

display_url: https://stockcapitalmfo.com.br

collections:

  # ==============================
  # PUBLICAÇÕES
  # ==============================

  - name: "cartas"
    label: "Cartas"
    folder: "src/content/cartas"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", format: "DD/MM/YYYY", date_format: "DD/MM/YYYY", time_format: false }
      - { name: "summary", label: "Resumo", widget: "text", required: false }
      - { name: "pdf", label: "PDF", widget: "file", media_library: { allow_multiple: false }, allow_types: ["pdf"] }

  - name: "relatorios"
    label: "Relatórios"
    folder: "src/content/relatorios"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", format: "DD/MM/YYYY", date_format: "DD/MM/YYYY", time_format: false }
      - { name: "summary", label: "Resumo", widget: "text", required: false }
      - { name: "pdf", label: "PDF", widget: "file", media_library: { allow_multiple: false }, allow_types: ["pdf"] }

  - name: "insights"
    label: "Insights"
    folder: "src/content/insights"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", format: "DD/MM/YYYY", date_format: "DD/MM/YYYY", time_format: false }
      - { name: "summary", label: "Resumo", widget: "text", required: false }
      - { name: "pdf", label: "PDF", widget: "file", media_library: { allow_multiple: false }, allow_types: ["pdf"] }

  - name: "compliance"
    label: "Compliance"
    folder: "src/content/compliance"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Título", widget: "string" }
      - { name: "date", label: "Data", widget: "datetime", format: "DD/MM/YYYY", date_format: "DD/MM/YYYY", time_format: false }
      - { name: "summary", label: "Resumo", widget: "text", required: false }
      - { name: "pdf", label: "PDF", widget: "file", media_library: { allow_multiple: false }, allow_types: ["pdf"] }

  # ==============================
  # GRÁFICOS - CONFIG
  # ==============================

  - name: "charts_config"
    label: "Gráficos • Configurações (técnico)"
    description: "Área técnica. Controla como os gráficos do site são desenhados (ligados aos arquivos de 'Gráficos • Dados'). Alterações aqui podem quebrar a exibição de um gráfico — em caso de dúvida, consulte o desenvolvedor antes de editar."
    format: "json"
    files:

      - name: "mfo_desempenho"
        label: "Gráfico: Desempenho"
        file: "src/content/rentabilidade/charts/mfo-desempenho.json"
        fields:
          - { name: "type", widget: "hidden", default: "desempenho" }
          - { name: "title", label: "Título", widget: "string" }
          - { name: "subtitle", label: "Subtítulo", widget: "string", required: false }
          - { name: "notes", label: "Notas (rodapé do gráfico)", widget: "text", required: false }
          - { name: "autoplay_seconds", label: "Intervalo do auto-play (segundos)", widget: "number", value_type: "int", min: 0, default: 8, hint: "A cada quantos segundos o gráfico alterna automaticamente. Use 0 para desativar o auto-play." }

          - label: "Modo de acumulação"
            name: "accumulation"
            widget: "select"
            options:
              - { label: "Soma simples (percentuais somados mês a mês)", value: "sum" }
              - { label: "Composto (juros sobre juros, mês a mês)", value: "compound" }
            default: "sum"
            hint: "Como os valores mensais de cada série são acumulados no gráfico."

          - label: "Séries do gráfico"
            name: "series"
            widget: "list"
            summary: "{{fields.label}}"
            hint: "Cada série é uma linha do gráfico. \"Fonte (JSON)\" precisa apontar para um arquivo cadastrado em 'Gráficos • Dados'."
            fields:
              - { name: "label", label: "Rótulo (aparece na legenda)", widget: "string" }
              - { name: "source", label: "Fonte (arquivo JSON de dados)", widget: "file", allow_types: ["json"], hint: "Escolha um arquivo de dados já cadastrado em Gráficos • Dados." }
              - { name: "y", label: "Campo lido do arquivo de dados", widget: "string", default: "rendimento", hint: "Nome do campo numérico dentro do arquivo de dados (normalmente \"rendimento\")." }

      - name: "volatilidade_ltm"
        label: "Gráfico: Volatilidade"
        file: "src/content/rentabilidade/charts/volatilidade-ltm.json"
        fields:
          - { name: "type", widget: "hidden", default: "volatilidade" }
          - { name: "title", label: "Título", widget: "string" }
          - { name: "source", label: "Fonte (arquivo JSON de dados)", widget: "file", allow_types: ["json"], hint: "Escolha um arquivo de dados já cadastrado em Gráficos • Dados." }

      - name: "risco_retorno"
        label: "Gráfico: Risco-Retorno"
        file: "src/content/rentabilidade/charts/risco-retorno.json"
        fields:
          - { name: "type", widget: "hidden", default: "risco-retorno" }
          - { name: "title", label: "Título", widget: "string" }
          - { name: "source", label: "Fonte (arquivo JSON de dados)", widget: "file", allow_types: ["json"], hint: "Escolha um arquivo de dados já cadastrado em Gráficos • Dados." }

  # ==============================
  # GRÁFICOS - DADOS
  # ==============================

  - name: "charts_data"
    label: "Gráficos • Dados (técnico)"
    description: "Área técnica. São os números por trás dos gráficos do site (diferente da tabela de rentabilidade da página de cada Fundo — os dois não se atualizam automaticamente um pelo outro)."
    format: "json"
    files:

      - name: "desempenho_portfolio"
        label: "Dados • Desempenho (Portfólio)"
        file: "src/content/rentabilidade/data/desempenho/mfo-portfolio.json"
        fields:
          - label: "Série mensal"
            name: "series"
            widget: "list"
            summary: "{{fields.date}} — {{fields.rendimento}}%"
            hint: "Rendimento do mês (não acumulado). Ex.: se o fundo rendeu 1,5% em março, digite 1.5 — o gráfico soma os meses automaticamente."
            fields:
              - { label: "Mês", name: "date", widget: "datetime", format: "YYYY-MM", date_format: "YYYY-MM", time_format: false }
              - { label: "Rendimento do mês (%)", name: "rendimento", widget: "number", value_type: "float" }

      - name: "desempenho_alpha"
        label: "Dados • Desempenho (Alpha¹ — retorno acima do IPCA)"
        file: "src/content/rentabilidade/data/desempenho/alpha.json"
        fields:
          - label: "Série mensal"
            name: "series"
            widget: "list"
            summary: "{{fields.date}} — {{fields.rendimento}}%"
            hint: "Rendimento do mês (não acumulado), mesma lógica da linha \"Portfólio\". Use os mesmos meses para as linhas ficarem alinhadas no gráfico."
            fields:
              - { label: "Mês", name: "date", widget: "datetime", format: "YYYY-MM", date_format: "YYYY-MM", time_format: false }
              - { label: "Rendimento do mês (%)", name: "rendimento", widget: "number", value_type: "float" }

      - name: "desempenho_ifha"
        label: "Dados • Desempenho (IFHA² — fundos multimercado no Brasil)"
        file: "src/content/rentabilidade/data/desempenho/ifha.json"
        fields:
          - label: "Série mensal"
            name: "series"
            widget: "list"
            summary: "{{fields.date}} — {{fields.rendimento}}%"
            hint: "Rendimento do mês (não acumulado), mesma lógica da linha \"Portfólio\". Use os mesmos meses para as linhas ficarem alinhadas no gráfico."
            fields:
              - { label: "Mês", name: "date", widget: "datetime", format: "YYYY-MM", date_format: "YYYY-MM", time_format: false }
              - { label: "Rendimento do mês (%)", name: "rendimento", widget: "number", value_type: "float" }

      - name: "desempenho_ipca"
        label: "Dados • Desempenho (IPCA — índice de inflação)"
        file: "src/content/rentabilidade/data/desempenho/ipca.json"
        fields:
          - label: "Série mensal"
            name: "series"
            widget: "list"
            summary: "{{fields.date}} — {{fields.rendimento}}%"
            hint: "Rendimento do mês (não acumulado), mesma lógica da linha \"Portfólio\". Use os mesmos meses para as linhas ficarem alinhadas no gráfico."
            fields:
              - { label: "Mês", name: "date", widget: "datetime", format: "YYYY-MM", date_format: "YYYY-MM", time_format: false }
              - { label: "Rendimento do mês (%)", name: "rendimento", widget: "number", value_type: "float" }

      - name: "risco_retorno_sortino_sharpe"
        label: "Dados • Risco-Retorno"
        file: "src/content/rentabilidade/data/risco-retorno/sortino-sharpe.json"
        fields:
          - label: "Série mensal"
            name: "series"
            widget: "list"
            summary: "{{fields.date}} — Sortino {{fields.sortino}} / Sharpe {{fields.sharpe}}"
            fields:
              - { label: "Mês", name: "date", widget: "datetime", format: "YYYY-MM", date_format: "YYYY-MM", time_format: false }
              - { label: "Sortino", name: "sortino", widget: "number", value_type: "float" }
              - { label: "Sharpe", name: "sharpe", widget: "number", value_type: "float" }

      - name: "volatilidade_ltm_dados"
        label: "Dados • Volatilidade (LTM)"
        file: "src/content/rentabilidade/data/volatilidade/ltm.json"
        fields:
          - label: "Série mensal"
            name: "series"
            widget: "list"
            summary: "{{fields.date}} — {{fields.vol}}%"
            fields:
              - { label: "Mês", name: "date", widget: "datetime", format: "YYYY-MM", date_format: "YYYY-MM", time_format: false }
              - { label: "Volatilidade do mês (%)", name: "vol", widget: "number", value_type: "float" }

  # ==============================
  # FUNDOS
  # ==============================

  - name: "fundos"
    label: "Fundos"
    folder: "src/content/fundos"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    summary: "{{fields.nome}} — {{fields.categoria_label}}"
    # Preview desligado só nesta coleção: a estrutura aninhada (objetos
    # dentro de objetos, com listas dentro) faz até o preview PADRÃO do
    # Decap quebrar ("Minified React error #62") ao abrir qualquer
    # entrada — acontece mesmo sem nenhum preview customizado nosso.
    # As outras coleções (Cartas, Relatórios, Gráficos, etc.) usam o
    # preview padrão normalmente. O formulário de edição de Fundos
    # continua 100% funcional, só sem o preview ao lado.
    editor:
      preview: false

    fields:
      - { label: "ID", name: "id", widget: "string", hint: "Identificador interno do fundo. Não precisa mudar depois de criado." }
      - { label: "Slug", name: "slug", widget: "string", hint: "Usado na URL da página do fundo no site. Evite espaços e acentos." }
      - { label: "Categoria (rótulo)", name: "categoria_label", widget: "string", required: false, hint: "Ex.: RENDA VARIÁVEL. Aparece como etiqueta na página do fundo." }
      - { label: "Nome do Fundo", name: "nome", widget: "string" }
      - { label: "Símbolo", name: "simbolo", widget: "string", hint: "Sigla curta usada em destaque na página do fundo." }

      - label: "Topo (cabeçalho da página do fundo)"
        name: "topo"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Taxa Administração Destaque", name: "taxa_administracao_destaque", widget: "string", required: false }
          - { label: "Texto Prospecto (abaixo da taxa)", name: "prospecto_label", widget: "string", required: false }

          - label: "Card • Valor da Cota"
            name: "valor_cota"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título do card (opcional)", name: "label", widget: "string", required: false }
              - { label: "Data de referência", name: "data_referencia", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "Data usada para calcular \"atualizado em\" no card do site." }
              - { label: "Valor (R$)", name: "valor", widget: "number", value_type: "float", required: false }

          - label: "Card • Variação da Cota"
            name: "variacao_cota"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título do card (opcional)", name: "label", widget: "string", required: false }
              - { label: "Data de referência", name: "data_referencia", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Valor (%)", name: "valor", widget: "number", value_type: "float", required: false }

          - label: "Card • Rendimento Total da Cota"
            name: "rendimento_total_cota"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Título do card (opcional)", name: "label", widget: "string", required: false }
              - { label: "Data de referência", name: "data_referencia", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Valor (%)", name: "valor", widget: "number", value_type: "float", required: false }

      - label: "Características-chave"
        name: "caracteristicas_chave"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Patrimônio líquido do fundo", name: "patrimonio_liquido", widget: "string", required: false }
          - { label: "Bolsa", name: "bolsa", widget: "string", required: false }
          - { label: "Classe de ativos", name: "classe_de_ativos", widget: "string", required: false }
          - { label: "Código CVM", name: "codigo_cvm", widget: "string", required: false }
          - { label: "Domicílio", name: "domicilio", widget: "string", required: false }
          - { label: "Data de constituição", name: "data_constituicao", widget: "string", required: false }
          - { label: "Moeda", name: "moeda", widget: "string", required: false }
          - { label: "Índice de benchmark", name: "benchmark", widget: "string", required: false }

      - label: "Características do portfólio"
        name: "caracteristicas_portfolio"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Número de ativos na carteira", name: "numero_ativos_carteira", widget: "number", value_type: "int", required: false }
          - { label: "Retorno 12m", name: "retorno_12m", widget: "string", required: false }
          - { label: "Volatilidade", name: "volatilidade", widget: "string", required: false }
          - { label: "Beta (Versus CDI)", name: "beta", widget: "string", required: false }
          - { label: "Sharpe", name: "sharpe", widget: "string", required: false }
          - { label: "Máximo drawdown", name: "maximo_drawdown", widget: "string", required: false }

      - label: "Exposição"
        name: "exposicao"
        widget: "object"
        collapsed: true
        fields:
          - label: "Itens (Setores)"
            name: "itens"
            widget: "list"
            summary: "{{fields.setor}} — {{fields.percentual}}%"
            hint: "A soma dos percentuais deve fechar em 100%."
            fields:
              - { label: "Setor", name: "setor", widget: "string" }
              - { label: "Percentual (%)", name: "percentual", widget: "number", value_type: "float", min: 0, max: 100 }

      - label: "Rentabilidade"
        name: "rentabilidade"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Formato do mês (referência)", name: "formato_mes", widget: "string", default: "MM/AAAA", required: false, hint: "Apenas um lembrete do padrão usado abaixo (MM/AAAA). Não precisa alterar." }
          - label: "Tabela mensal (Fundo x CDI)"
            name: "tabela_mensal"
            widget: "list"
            summary: "{{fields.mes}} • Fundo: {{fields.fundo}}% • CDI: {{fields.cdi}}%"
            hint: "Uma linha por mês. Para adicionar o mês mais recente, clique em \"Adicionar\" no final da lista."
            fields:
              - {
                  label: "Mês (MM/AAAA)",
                  name: "mes",
                  widget: "string",
                  pattern: ["^(0[1-9]|1[0-2])\\/(19|20)\\d{2}$", "Use MM/AAAA. Ex: 02/2026"]
                }
              - { label: "Fundo (%)", name: "fundo", widget: "number", value_type: "float" }
              - { label: "CDI (%)", name: "cdi", widget: "number", value_type: "float" }

      - label: "Taxas"
        name: "taxas"
        widget: "list"
        required: false
        summary: "{{fields.nome}} — {{fields.valor}}"
        fields:
          - { label: "Nome", name: "nome", widget: "string" }
          - { label: "Valor", name: "valor", widget: "string" }

      - label: "Documentos"
        name: "documentos"
        widget: "list"
        summary: "{{fields.titulo}}"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Data (DD/MM/AAAA)", name: "data", widget: "string", required: false }
          - { label: "PDF", name: "pdf", widget: "file", allow_types: ["pdf"] }
