<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Stock Capital — CMS</title>
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonte do site (Poppins), pra manter a mesma identidade visual -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- CSS do preview -->
    <link rel="stylesheet" href="/admin/brand.css" />
    <link rel="stylesheet" href="/admin/preview.css" />
  </head>
  <body>
    <header class="sc-admin-header">
      <a href="/" class="sc-admin-logo" aria-label="Ir para o site">
        <img src="/admin/logo.png" alt="Stock Capital" />
      </a>
    </header>

    <!-- Raiz exigida pelo Decap -->
    <div id="nc-root"></div>

    <!-- NÃO usar window.CMS_MANUAL_INIT aqui: testamos e é um bug conhecido,
         ainda sem correção oficial, do próprio Decap CMS 3.8.3 (várias
         issues abertas no GitHub deles com o mesmo erro). Com manual init
         ligado, o app quebra ao montar (tela de erro vermelha: "Failed to
         execute 'removeChild' on 'Node'") — o React acaba tentando montar
         a árvore duas vezes no mesmo #nc-root. Por isso o app usa o
         auto-init padrão do Decap; o locale "pt" embutido no bundle (já
         bem completo) cobre a tradução, mesmo sem o nosso registerLocale
         customizado (ver public/admin/locales/pt.js) conseguir "vencer" a
         corrida contra o auto-init. -->

    <!-- 1) Decap CMS (bundle LOCAL) -->
    <script src="/admin/decap-cms-3.8.3.js" defer></script>

    <!-- 2) Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
    <script src="/identity-widget-logo.js" defer></script>

    <!-- 3) Seus scripts (depois do Decap) -->
    <script src="/admin/preview.js" defer></script>
    <script src="/admin/locales/pt.js" defer></script>
    <script src="/admin/init.js" defer></script>
  </body>
</html>
